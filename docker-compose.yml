services:
  frontend:
    container_name: dvd-rental-frontend
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    container_name: dvd-rental-backend
    build: ./backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - database
    env_file:
      - .env

  database:
    image: postgres:17
    container_name: pg-dvd-rental
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: group3_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    env_file: .env

volumes:
  pgdata:
